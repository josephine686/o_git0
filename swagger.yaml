swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      #produces:
       # - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error







  /accounts:
    get:
      security:
        - Bearer: []

      tags:
        - Transactions

      summary: Get user accounts

      produces:
        - application/json

      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/Account"

  /accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []

      tags:
        - Transactions

      summary: Get account transactions

      produces:
        - application/json

      parameters:
        - name: accountId
          in: path
          required: true
          type: integer

      responses:
        "200":
          description: Success
          schema:
            $ref: "#/definitions/Transaction"

  /accounts/{accountId}/transactions/{transactionId}:
    patch:
      security:
        - Bearer: []

      tags:
        - Transactions

      summary: Update transaction

      consumes:
        - application/json

      parameters:
        - name: accountId
          in: path
          required: true
          type: integer

        - name: transactionId
          in: path
          required: true
          type: integer

        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/TransactionUpdate"

      responses:
        "200":
          description: Updated successfully
          schema:
            $ref: "#/definitions/Transaction"

        "400":
          description: Invalid request

        "403":
          description: Forbidden

        "404":
          description: Transaction not found

        "500":
          description: Internal Server Error











securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
      userName:
        type: string
        description: user public name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      userName:
        type: string






  Account:
    type: object
    properties:
      id:
        type: integer

      argentBankChecking:
        type: number
        format: float

      availableBalance:
        type: number
        format: float

  Transaction:
    type: object

    properties:
      id:
        type: integer

      date:
        type: string
        format: date-time

      amount:
        type: number
        format: float

      balance:
        type: number
        format: float

      details:
        type: object
        properties:
          transaction_type:
            type: string

          category:
            type: string

          note:
            type: string

  TransactionUpdate:
    type: object

    properties:
      transaction_type:
        type: string

      category:
        type: string

      note:
        type: string